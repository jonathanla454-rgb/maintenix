<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172554"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="application-name" content="Maintenix"><link rel="icon" type="image/png" href="icons/icon-192.png"><title>Maintenix</title><link rel="manifest" href="manifest.webmanifest"><style>body{margin:0;background:#eef2f7;color:#15253e;font:15px system-ui}header{background:#10233f;color:white;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:20px;margin:0}main{max-width:1000px;margin:auto;padding:20px}button,select,input,textarea{font:inherit;border-radius:9px;padding:10px;border:1px solid #cbd5e1}button{cursor:pointer;background:#1768c4;color:white;border:0}button:disabled{opacity:.5}nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}nav button{background:#dce7f5;color:#12385d}nav button.active{background:#1768c4;color:white}.card{background:white;border:1px solid #dce3eb;border-radius:15px;padding:17px;margin:12px 0;box-shadow:0 2px 5px #132c4b0b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.metric{font-size:30px;font-weight:750}label{display:grid;gap:5px;font-weight:600}form{display:grid;gap:12px}small,.muted{color:#5c6a7d}.tag{background:#e8effa;border-radius:20px;padding:4px 9px;font-size:12px}.danger{background:#a82739}.secondary{background:#e4ebf5;color:#1c3c60}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.hidden{display:none}footer{text-align:center;color:#64748b;padding:24px}.notice{background:#fff4dc;padding:12px;border-radius:10px;color:#704800}select{background:white}textarea{min-height:70px}@media(prefers-color-scheme:dark){body{background:#0b1220;color:#edf3ff}header{background:#111b32}.card{background:#172238;border-color:#293850;box-shadow:none}nav button{background:#24354f;color:#e4edff}nav button.active{background:#4e85e7;color:#fff}input,textarea,select{background:#172238;color:#f1f5ff;border-color:#455673}.secondary{background:#293a54;color:#f0f4ff}.tag{background:#2d3d55;color:#e5eeff}small,.muted,footer{color:#acbbd0}.notice{background:#443519;color:#ffe9b0}}@media(max-width:600px){main{padding:14px}header{padding:14px}nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}nav button{font-size:12px;padding:10px 4px}.card{padding:14px}button{min-height:42px}}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #7cafff;outline-offset:2px}</style></head><body><header><div><h1>⚙ Maintenix</h1><small style="color:#c6d8ef" id="subtitle">Maintenance Operations</small></div><select id="lang"><option value="en">English</option><option value="es">Español</option></select></header><main><div class="notice" id="warning"></div><nav id="nav"></nav><section id="view"></section></main><footer>Independent prototype • Local device storage • No real authentication or registration</footer><script>
const translations={en:{subtitle:'Maintenance Operations',warning:'Prototype only: data stays in this browser. Demo roles are NOT secure login. Do not enter confidential property or employee information.',dashboard:'Dashboard',orders:'Work Orders',preventive:'Preventive',rooms:'Room History',users:'Team & Roles',hotel:'Property',room:'Unit / Area',category:'Category',description:'Description',priority:'Priority',status:'Status',assigned:'Assigned Engineer',save:'Save work order',new:'New Work Order',edit:'Edit',remove:'Delete',cancel:'Cancel',pending:'Pending',progress:'In Progress',completed:'Completed',low:'Low',normal:'Normal',high:'High',urgent:'Urgent',all:'All',title:'Title',due:'Due date',savepm:'Save preventive task',addpm:'New preventive task',empty:'No records yet',role:'Demo view',admin:'Administrator',engineer:'Engineer',name:'Engineer name',adduser:'Add engineer',active:'Active',disabled:'Disabled',roomhistory:'Search room',export:'Export JSON',batteries:'AA Batteries',ac:'Air Conditioning',plumbing:'Plumbing',electrical:'Electrical',other:'Other',created:'Created',audit:'Activity history',hotelaccess:'Assigned property',reassign:'Reassign',deleteconfirm:'Delete this record?',offline:'Offline demo'},es:{subtitle:'Operaciones de mantenimiento',warning:'Solo prototipo: los datos quedan en este navegador. Los roles de demostración NO son un inicio de sesión seguro. No ingreses información confidencial de propiedades o empleados.',dashboard:'Panel',orders:'Órdenes de trabajo',preventive:'Preventivo',rooms:'Historial de habitaciones',users:'Equipo y roles',hotel:'Propiedad',room:'Unidad / Área',category:'Categoría',description:'Descripción',priority:'Prioridad',status:'Estado',assigned:'Ingeniero asignado',save:'Guardar orden',new:'Nueva orden',edit:'Editar',remove:'Eliminar',cancel:'Cancelar',pending:'Pendiente',progress:'En proceso',completed:'Completado',low:'Baja',normal:'Normal',high:'Alta',urgent:'Urgente',all:'Todos',title:'Título',due:'Fecha de revisión',savepm:'Guardar preventivo',addpm:'Nuevo preventivo',empty:'Sin registros todavía',role:'Vista de demostración',admin:'Administrador',engineer:'Ingeniero',name:'Nombre del ingeniero',adduser:'Agregar ingeniero',active:'Activo',disabled:'Desactivado',roomhistory:'Buscar habitación',export:'Exportar JSON',batteries:'Baterías AA',ac:'Aire acondicionado',plumbing:'Plomería',electrical:'Electricidad',other:'Otro',created:'Creado',audit:'Historial de actividad',hotelaccess:'Propiedad asignada',reassign:'Reasignar',deleteconfirm:'¿Eliminar este registro?',offline:'Demostración sin conexión'}};
const storeKey='maintenix-demo-v1';let data;try{data=JSON.parse(localStorage.getItem(storeKey))}catch{}data ||= {orders:[],preventive:[],users:[{id:'engineer1',name:'Demo Engineer',hotel:'Property A',active:true}],audit:[]};let lang=localStorage.getItem('maintenix-lang')||'en',page='dashboard',role='admin',editing=null,filterHotel='All';const $=id=>document.getElementById(id),t=k=>translations[lang][k]||k,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(action){if(action)data.audit.unshift({action,time:new Date().toLocaleString()});localStorage.setItem(storeKey,JSON.stringify(data))}function opts(arr,selected){return arr.map(x=>`<option value="${esc(x)}" ${x===selected?'selected':''}>${esc(t(x))}</option>`).join('')}function field(name,value='',type='text',required=false){return `<label>${t(name)}<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''}></label>`}function select(name,values,value){return `<label>${t(name)}<select name="${name}">${opts(values,value)}</select></label>`}function header(title){return `<h2>${t(title)}</h2>`}function hotelSel(value='Property A'){return select('hotel',['Property A','Property B'],value)}function render(){document.documentElement.lang=lang;$('lang').value=lang;$('subtitle').textContent=t('subtitle');$('warning').textContent=t('warning');$('nav').innerHTML=['dashboard','orders','preventive','rooms','users'].map(p=>`<button class="${page===p?'active':''}" onclick="navigate('${p}')">${t(p)}</button>`).join('');let v='';if(page==='dashboard'){const a=data.orders;v=header('dashboard')+`<div class="grid">${[['pending',a.filter(o=>o.status==='pending').length],['progress',a.filter(o=>o.status==='progress').length],['completed',a.filter(o=>o.status==='completed').length],['preventive',data.preventive.length]].map(([k,n])=>`<div class="card"><div class="metric">${n}</div>${t(k)}</div>`).join('')}</div><div class="card">${select('role',['admin','engineer'],role)}<p class="muted">${lang==='es'?'El cambio de rol es únicamente una simulación visual.':'Role switching is a visual simulation only.'}</p><button onclick="exportData()">${t('export')}</button></div><div class="card"><h3>${t('audit')}</h3>${data.audit.slice(0,12).map(a=>`<p>${esc(a.time)} · ${esc(a.action)}</p>`).join('')||t('empty')}</div>`}if(page==='orders'){v=header('orders')+`<div class="card">${select('hotel',['All','Property A','Property B'],filterHotel)}</div><div class="card"><h3>${t(editing?'edit':'new')}</h3><form id="orderform">${hotelSel(editing?.hotel)}${field('room',editing?.room,'text',true)}${select('category',['batteries','ac','plumbing','electrical','other'],editing?.category||'ac')}${field('title',editing?.title,'text',true)}<label>${t('description')}<textarea name="description">${esc(editing?.description)}</textarea></label>${select('priority',['low','normal','high','urgent'],editing?.priority||'normal')}${select('status',['pending','progress','completed'],editing?.status||'pending')}${select('assigned',data.users.filter(u=>u.active).map(u=>u.id).concat(['unassigned']),editing?.assigned||'unassigned')}<button>${t('save')}</button>${editing?`<button type="button" class="secondary" onclick="editing=null;render()">${t('cancel')}</button>`:''}</form></div>`+data.orders.filter(o=>filterHotel==='All'||o.hotel===filterHotel).map(o=>`<div class="card"><b>${esc(o.hotel)} · ${esc(o.room)} · ${esc(o.title)}</b><p>${esc(t(o.category))} · <span class="tag">${t(o.status)}</span> · ${t(o.priority)}</p><p>${esc(o.description)}</p><small>${t('assigned')}: ${esc(data.users.find(u=>u.id===o.assigned)?.name||'—')} · ${esc(o.created)}</small><div class="actions"><button class="secondary" onclick="editOrder('${o.id}')">${t('edit')}</button>${role==='admin'?`<button class="danger" onclick="removeOrder('${o.id}')">${t('remove')}</button>`:''}</div></div>`).join('')}if(page==='preventive'){v=header('preventive')+`<div class="card"><h3>${t('addpm')}</h3><form id="pmform">${hotelSel()}${field('room','', 'text',true)}${select('category',['batteries','ac','plumbing','electrical','other'],'batteries')}${field('due','','date',true)}<button>${t('savepm')}</button></form></div>`+data.preventive.map(p=>`<div class="card"><b>${esc(p.hotel)} · ${esc(p.room)}</b><p>${t(p.category)} · ${t('due')}: ${esc(p.due)}</p>${role==='admin'?`<button class="danger" onclick="removePM('${p.id}')">${t('remove')}</button>`:''}</div>`).join('')}if(page==='rooms'){v=header('rooms')+`<div class="card">${field('roomhistory')}<div id="roomresults"></div></div>`}if(page==='users'){v=header('users')+`<div class="card"><h3>${t('adduser')}</h3><form id="userform">${field('name','', 'text',true)}${hotelSel()}<button ${role!=='admin'?'disabled':''}>${t('adduser')}</button></form></div>`+data.users.map(u=>`<div class="card"><b>${esc(u.name)}</b><p>${esc(u.hotel)} · ${t(u.active?'active':'disabled')}</p>${role==='admin'?`<button class="secondary" onclick="toggleUser('${u.id}')">${t(u.active?'disabled':'active')}</button>`:''}</div>`).join('')} $('view').innerHTML=v;const forms={orderform:saveOrder,pmform:savePM,userform:saveUser};Object.entries(forms).forEach(([id,fn])=>{if($(id))$(id).onsubmit=e=>{e.preventDefault();fn(new FormData(e.target))}});const r=document.querySelector('select[name=role]');if(r)r.onchange=e=>{role=e.target.value;render()};const h=document.querySelector('select[name=hotel]');if(page==='orders'&&h)h.onchange=e=>{filterHotel=e.target.value;render()};const search=document.querySelector('input[name=roomhistory]');if(search)search.oninput=e=>{$('roomresults').innerHTML=data.orders.filter(o=>o.room.toLowerCase().includes(e.target.value.toLowerCase())&&e.target.value).map(o=>`<p>${esc(o.hotel)} · ${esc(o.room)} · ${esc(o.title)} · ${t(o.status)}</p>`).join('')||t('empty')}}function navigate(p){page=p;editing=null;render()}function id(){return globalThis.crypto?.randomUUID?.()||String(Date.now())}function saveOrder(f){let obj=Object.fromEntries(f);if(editing){const found=data.orders.find(o=>o.id===editing.id);if(found)Object.assign(found,obj)}else data.orders.unshift({...obj,id:id(),created:new Date().toLocaleString()});persist('Work order saved');editing=null;render()}function editOrder(i){editing=data.orders.find(o=>o.id===i);render()}function removeOrder(i){if(role!=='admin'||!confirm(t('deleteconfirm')))return;data.orders=data.orders.filter(o=>o.id!==i);persist('Work order deleted');render()}function savePM(f){data.preventive.unshift({...Object.fromEntries(f),id:id()});persist('Preventive task added');render()}function removePM(i){if(role!=='admin'||!confirm(t('deleteconfirm')))return;data.preventive=data.preventive.filter(p=>p.id!==i);persist('Preventive task deleted');render()}function saveUser(f){if(role!=='admin')return;data.users.push({...Object.fromEntries(f),id:id(),active:true});persist('Demo engineer added');render()}function toggleUser(i){if(role!=='admin')return;let u=data.users.find(x=>x.id===i);if(u)u.active=!u.active;persist('Demo engineer status changed');render()}function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='maintenix-demo.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('lang').onchange=e=>{lang=e.target.value;localStorage.setItem('maintenix-lang',lang);render()};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
